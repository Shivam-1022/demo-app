apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
  namespace: prod

spec:
  replicas: 3

  selector:
    matchLabels:
      app: demo-app

  template:
    metadata:
      labels:
        app: demo-app

    spec:
      containers:
      - name: demo-app
        image: shivam1022/demo-app:latest

        ports:
        - containerPort: 8080